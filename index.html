            const [run1000RulesByForm, setRun1000RulesByForm] = useState(() => safeLocalStorage.getItem('pe_run_1000_rules_by_form_v17_clear', DEFAULT_RUN_1000_RULES_BY_FORM));

            const [dseSitUpRules, setDseSitUpRules] = useState(() => safeLocalStorage.getItem('pe_dse_situp_rules_v17_clear', DEFAULT_DSE_SITUP_RULES));

            const [importModalOpen, setImportModalOpen] = useState(false);
            const [previewStudents, setPreviewStudents] = useState([]);
            const [importError, setImportError] = useState("");
            const [addModalOpen, setAddModalOpen] = useState(false);
            
            // 💡 預設一千米跑 (run1000Raw) 和 DSE 1609米跑 (dseRun1609Raw) 為 0 
            const [newStudent, setNewStudent] = useState({ class: "2A", number: "", name: "", gender: "M", isDsePe: false, attendance: 0, conductGrade: "B", sitUpsRaw: 0, pushUpsRaw: 0, runLapsRaw: 0, sitReachRaw: 0, run1000Raw: 0, dseSitUpsRaw: 0, dsePullUpsRaw: 0, dseRun1609Raw: 0, dseSitReachRaw: 0, ...EMPTY_SKILLS });
            const [confirmModal, setConfirmModal] = useState(null);

            const [hasUnsavedConfig, setHasUnsavedConfig] = useState(false);

            // 🖊 本機「尚未同步」的修改欄位：同步時只上傳這些欄位，避免覆蓋其他老師已輸入的成績
            const [dirty, setDirty] = useState(() => safeLocalStorage.getItem('pe_dirty_v1', {}));
            const dirtyRef = useRef(dirty);
            const importColsRef = useRef({});
            const baseRef = useRef({});   // 最近一次從雲端讀到的資料，用來判斷「本機哪些欄位真的跟雲端不同」
            useEffect(() => { dirtyRef.current = dirty; safeLocalStorage.setItem('pe_dirty_v1', dirty); }, [dirty]);

            // 匯出篩選控制
            const [exportModalOpen, setExportModalOpen] = useState(false);
            const [exportScope, setExportScope] = useState("all"); 
            const [exportTargetClass, setExportTargetClass] = useState("All");
            const [exportTargetGrade, setExportTargetGrade] = useState("2"); 

            // 雲端 Apps Script
            const [cloudUrl, setCloudUrl] = useState(() => safeLocalStorage.getItem('pe_cloud_url_v17_clear', DEFAULT_CLOUD_URL));
            const [isSyncing, setIsSyncing] = useState(false);
            const [isCloudLoading, setIsCloudLoading] = useState(false);
            const [cloudConnectionStatus, setCloudConnectionStatus] = useState("pending");

            const pwdRef = useRef(passwordInput);
            useEffect(() => {
                pwdRef.current = passwordInput;
            }, [passwordInput]);

            function handleLoginAttempt(pwd) {
                if (pwd === '60706759') {
                    setIsAuthenticated(true);
                    safeSessionStorage.setItem('pe_app_authenticated', 'true');
                    setAuthError('');
                    showToast("🔓 系統安全解鎖！");
                } else {
                    setAuthError('密碼錯誤，請重新輸入。');
                    setPasswordInput('');
                }
            }

            useEffect(() => {
                if (isAuthenticated) return;
                const handleKeyDown = (event) => {
                    if (/^[0-9]$/.test(event.key)) {
                        setAuthError('');
                        setPasswordInput(prev => prev + event.key);
                    } else if (event.key === 'Backspace') {
                        setPasswordInput(prev => prev.slice(0, -1));
                    } else if (event.key === 'Enter') {
                        event.preventDefault();
                        handleLoginAttempt(pwdRef.current);
                    } else if (event.key === 'Escape') {
                        setPasswordInput('');
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [isAuthenticated]);

            const loadDataFromCloud = async (opts) => {
                const silent = opts && opts.silent === true;
                const targetUrl = cloudUrl || DEFAULT_CLOUD_URL;
                if (!targetUrl || !targetUrl.startsWith('https://script.google.com/')) {
                    setCloudConnectionStatus("failed");
                    return; 
                }
                setIsCloudLoading(true);
                try {
                    const response = await fetch(targetUrl, {
                        method: 'POST',
                        mode: 'cors',
                        redirect: 'follow',
                        body: JSON.stringify({ action: 'read' })
                    });
                    if (!response.ok) throw new Error(`HTTP 狀態碼錯誤: ${response.status}`);
                    const result = await response.json();
                    if (result.status === 'success') {
                        if (result.data && result.data.length > 0) {
                            result.data.forEach(d => { baseRef.current[d.id] = { ...normalizeStudent(d) }; });
                            const localMap = {};
                            students.forEach(s => { localMap[s.id] = s; });
                            const dirtyNow = dirtyRef.current || {};
                            const cloudIds = {};
                            const merged = result.data.map(d => {
                                cloudIds[d.id] = true;
                                const loc = localMap[d.id];
                                const out = { ...d };
                                // 本機尚未同步的欄位優先保留，不會被雲端舊值蓋掉
                                if (loc && dirtyNow[d.id]) Object.keys(dirtyNow[d.id]).forEach(k => { out[k] = loc[k]; });
                                return out;
                            });
                            // 本機新增、尚未同步到雲端的學生也保留
                            students.forEach(s => { if (!cloudIds[s.id] && dirtyNow[s.id]) merged.push(s); });
                            const normalizedMerged = merged.map(normalizeStudent);
                            setStudents(normalizedMerged);
                        }
                        if (result.config) {
                            const c = result.config;
                            if (c.thresholds) {
                                setThresholds(c.thresholds);
                                setTempThresholds(c.thresholds);
                            }
                            if (c.sitUpRules) setSitUpRulesByForm(c.sitUpRules);
                            if (c.pushUpRules) setPushUpRulesByForm(c.pushUpRules);
                            if (c.runRules) setRunRulesByForm(c.runRules);
                            if (c.sitReachRules) setSitReachRulesByForm(c.sitReachRules);
                            if (c.run1000Rules) setRun1000RulesByForm(c.run1000Rules);

                            // 🛡️ 雲端舊數據安全過濾：確保載入的 DSE 常模長度恰好為 5，防止 25級 覆蓋
                            if (c.dseSitUpRules && c.dseSitUpRules.M && c.dseSitUpRules.M.length === 5) setDseSitUpRules(c.dseSitUpRules);
                            if (c.dsePullUpRules && c.dsePullUpRules.M && c.dsePullUpRules.M.length === 5) setDsePullUpRules(c.dsePullUpRules);
                            if (c.dseRun1609Rules && c.dseRun1609Rules.M && c.dseRun1609Rules.M.length === 5) setDseRun1609Rules(c.dseRun1609Rules);
                            if (c.dseSitReachRules && c.dseSitReachRules.M && c.dseSitReachRules.M.length === 5) setDseSitReachRules(c.dseSitReachRules);
                        }
                        setCloudConnectionStatus("success");
                        setHasUnsavedConfig(false);
                        if (!silent) showToast("☁️ 雙向自動同步成功！已成功加載雲端自訂常模與分數標準。");
                    } else {
                        throw new Error(result.message || 'Apps Script 無效格式');
                    }
                } catch (err) {
                    console.error("雲端讀取失敗：", err);
                    setCloudConnectionStatus("failed");
                    showToast("⚠️ 無法連線至雲端，系統正在使用本機暫存模式運作。", "error");
                } finally {
                    setIsCloudLoading(false);
                }
            };

            useEffect(() => {
                if (isAuthenticated) {
                    loadDataFromCloud();
                }
            }, [isAuthenticated]);

            const testCloudConnection = async () => {
                showToast("⚡ 正在發送測試連線請求...");
                await loadDataFromCloud();
            };

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });

            const getFormOfStudent = (studentClass) => {
                const match = String(studentClass || "").trim().match(/^([1-6])/);
                return match ? match[1] : "2"; 
            };

            // ==================== 5項常規體能核心計分 (每項 20 分) ====================
            const calculateSitUpScore = (gender, count, studentClass) => {
                const raw = parseInt(count) || 0;
                const form = getFormOfStudent(studentClass);
                const formRules = sitUpRulesByForm[form] || sitUpRulesByForm["2"];
                const rules = gender === 'M' ? formRules.M : formRules.F;
                for (let i = 0; i < rules.length; i++) {
                    if (raw >= rules[i].req) return rules[i].score;
                }
                return 0;
            };

            const calculatePushUpScore = (gender, count, studentClass) => {
                const raw = parseInt(count) || 0;
                const form = getFormOfStudent(studentClass);
                const formRules = pushUpRulesByForm[form] || pushUpRulesByForm["2"];
                const rules = gender === 'M' ? formRules.M : formRules.F;
                for (let i = 0; i < rules.length; i++) {
                    if (raw >= rules[i].req) return rules[i].score;
                }
                return 0;
            };

            const calculateRunScore = (gender, laps, studentClass) => {
                const raw = parseInt(laps) || 0;
                const form = getFormOfStudent(studentClass);
                const formRules = runRulesByForm[form] || runRulesByForm["2"];
                const rules = gender === 'M' ? formRules.M : formRules.F;
                for (let i = 0; i < rules.length; i++) {
                    if (raw >= rules[i].req) return rules[i].score;
                }
                return 0;
            };

            const calculateSitReachScore = (gender, cm, studentClass) => {
                const raw = parseInt(cm) || 0;
                const form = getFormOfStudent(studentClass);
                const formRules = sitReachRulesByForm[form] || sitReachRulesByForm["2"];
                const rules = gender === 'M' ? formRules.M : formRules.F;
                for (let i = 0; i < rules.length; i++) {
                    if (raw >= rules[i].req) return rules[i].score;
                }
                return 0;
            };

            const calculateRun1000Score = (gender, seconds, studentClass) => {
                const raw = parseInt(seconds) || 9999;
                if (raw === 0 || raw === 9999) return 0; // 💡 0秒代表未登分，計為 0 分
                const form = getFormOfStudent(studentClass);
                const formRules = run1000RulesByForm[form] || run1000RulesByForm["2"];
                const rules = gender === 'M' ? formRules.M : formRules.F;
                for (let i = 0; i < rules.length; i++) {
                    if (raw <= rules[i].req) return rules[i].score;
                }
                return 0;
            };

            // ==================== 4項 DSE 核心計分 (每項最高得分 5 分) ====================
            const calculateDseSitUpScore = (gender, count) => {
                const raw = parseInt(count) || 0;
                const rules = gender === 'M' ? dseSitUpRules.M : dseSitUpRules.F;
                for (let i = 0; i < rules.length; i++) {
                    if (raw >= rules[i].req) return rules[i].score;
                }
                return 0;
            };

            const calculateDsePullUpScore = (gender, count) => {
                const raw = parseInt(count) || 0;
                const rules = gender === 'M' ? dsePullUpRules.M : dsePullUpRules.F;
                for (let i = 0; i < rules.length; i++) {
                    if (raw >= rules[i].req) return rules[i].score;
                }
                return 0;
            };

            const calculateDseRun1609Score = (gender, seconds) => {
                const raw = parseInt(seconds) || 9999;
                if (raw === 0 || raw === 9999) return 0; // 💡 0秒代表未登分，計為 0 分
                const rules = gender === 'M' ? dseRun1609Rules.M : dseRun1609Rules.F;
                for (let i = 0; i < rules.length; i++) {
                    if (raw <= rules[i].req) return rules[i].score;
                }
                return 0;
            };

            const calculateDseSitReachScore = (gender, cm) => {
                const raw = parseInt(cm) || 0;
                const rules = gender === 'M' ? dseSitReachRules.M : dseSitReachRules.F;
                for (let i = 0; i < rules.length; i++) {
                    if (raw >= rules[i].req) return rules[i].score;
                }
                return 0;
            };

            // 最終等第 100 分上限安全封頂
            const calculateGrade = (total100) => {
                if (total100 >= thresholds.A) return 'A';
                if (total100 >= thresholds.B) return 'B';
                if (total100 >= thresholds.C) return 'C';
                if (total100 >= thresholds.D) return 'D';
                if (total100 >= thresholds.E) return 'E';
                return 'F';
            };

            const getFormChineseLabel = (numStr) => {
                switch(numStr) {
                    case "1": return "一"; case "2": return "二"; case "3": return "三";
                    case "4": return "四"; case "5": return "五"; case "6": return "六";
                    default: return numStr;
                }
            };

            const formatTime = (totalSec) => {
                const m = Math.floor(totalSec / 60);
                const s = totalSec % 60;
                return `${m}分${s < 10 ? '0' : ''}${s}秒`;
            };

            // 💡 所有 LocalStorage 同步鍵為 v17_clear 以強制重新寫入乾淨的預設 0秒 資料 (解決緩存舊秒數殘留問題)
            useEffect(() => { safeLocalStorage.setItem('pe_grade_thresholds_v17_clear', thresholds); }, [thresholds]);
            useEffect(() => { safeLocalStorage.setItem('pe_sit_up_rules_by_form_v17_clear', sitUpRulesByForm); }, [sitUpRulesByForm]);
            useEffect(() => { safeLocalStorage.setItem('pe_push_up_rules_by_form_v17_clear', pushUpRulesByForm); }, [pushUpRulesByForm]);
            useEffect(() => { safeLocalStorage.setItem('pe_run_rules_by_form_v17_clear', runRulesByForm); }, [runRulesByForm]);
            useEffect(() => { safeLocalStorage.setItem('pe_sit_reach_rules_by_form_v17_clear', sitReachRulesByForm); }, [sitReachRulesByForm]);
            useEffect(() => { safeLocalStorage.setItem('pe_run_1000_rules_by_form_v17_clear', run1000RulesByForm); }, [run1000RulesByForm]);
            
            useEffect(() => { safeLocalStorage.setItem('pe_dse_situp_rules_v17_clear', dseSitUpRules); }, [dseSitUpRules]);
            useEffect(() => { safeLocalStorage.setItem('pe_dse_pullup_rules_v17_clear', dsePullUpRules); }, [dsePullUpRules]);
            useEffect(() => { safeLocalStorage.setItem('pe_dse_run1609_rules_v17_clear', dseRun1609Rules); }, [dseRun1609Rules]);
            useEffect(() => { safeLocalStorage.setItem('pe_dse_sitreach_rules_v17_clear', dseSitReachRules); }, [dseSitReachRules]);

            useEffect(() => { safeLocalStorage.setItem('pe_students_data_v17_clear', students); }, [students]);
            useEffect(() => { safeLocalStorage.setItem('pe_cloud_url_v17_clear', cloudUrl); }, [cloudUrl]);

            const filteredStudents = useMemo(() => {
                return students.filter(student => {
                    const name = (student.name || "").toLowerCase();
                    const no = (student.number || "").toString().toLowerCase();
                    const q = searchQuery.toLowerCase();
                    const matchesSearch = name.includes(q) || no.includes(q);
                    const matchesClass = selectedClass === 'All' || student.class === selectedClass;
                    return matchesSearch && matchesClass;
                });
            }, [students, searchQuery, selectedClass]);

            const classesList = useMemo(() => {
                return ['All', ...new Set(students.map(s => s.class))].sort();
            }, [students]);

            const totalPages = Math.ceil(filteredStudents.length / ITEMS_PER_PAGE) || 1;
            const paginatedStudents = useMemo(() => {
                const start = (currentPage - 1) * ITEMS_PER_PAGE;
                return filteredStudents.slice(start, start + ITEMS_PER_PAGE);
            }, [filteredStudents, currentPage]);

            const currentMobileIndexSafe = Math.min(currentMobileIndex, Math.max(0, filteredStudents.length - 1));
            const currentStudent = filteredStudents[currentMobileIndexSafe] || null;

            const updateStudentValue = (id, field, val) => {
                setDirty(prev => ({ ...prev, [id]: { ...(prev[id] || {}), [field]: true } }));
                setStudents(prev => {
                    const next = prev.map(student => {
                        if (student.id === id) {
                            let updated = { ...student, [field]: val };
                            if (field === 'class') updated.class = String(val || "").toUpperCase();
                            if (field === 'attendance') updated.attendance = Math.min(20, Math.max(0, parseInt(val) || 0));
                            if (field === 'sitUpsRaw') updated.sitUpsRaw = Math.max(0, parseInt(val) || 0);
                            if (field === 'pushUpsRaw') updated.pushUpsRaw = Math.max(0, parseInt(val) || 0);
                            if (field === 'runLapsRaw') updated.runLapsRaw = Math.max(0, parseInt(val) || 0);
                            if (field === 'sitReachRaw') updated.sitReachRaw = Math.max(0, parseInt(val) || 0);
                            if (field === 'run1000Raw') updated.run1000Raw = Math.max(0, parseInt(val) || 0);

                            // DSE 成績
                            if (field === 'dseSitUpsRaw') updated.dseSitUpsRaw = Math.max(0, parseInt(val) || 0);
                            if (field === 'dsePullUpsRaw') updated.dsePullUpsRaw = Math.max(0, parseInt(val) || 0);
                            if (field === 'dseRun1609Raw') updated.dseRun1609Raw = Math.max(0, parseInt(val) || 0);
                            if (field === 'dseSitReachRaw') updated.dseSitReachRaw = Math.max(0, parseInt(val) || 0);

                            if (field === 'height') updated.height = Math.min(250, Math.max(0, Math.round((parseFloat(val) || 0) * 10) / 10));
                            if (field === 'weight') updated.weight = Math.min(300, Math.max(0, Math.round((parseFloat(val) || 0) * 10) / 10));
                            if (/^skillPts[1-6]$/.test(field)) updated[field] = Math.min(SKILL_MAX_PER_SLOT, Math.max(0, parseInt(val) || 0));
                            if (/^skillItem[1-6]$/.test(field)) updated[field] = String(val || '');
                            return updated;
                        }
                        return student;
                    });
                    return next;
                });
            };

            const studentScores = useMemo(() => {
                if (!currentStudent) return null;
                const attendance = currentStudent.attendance;
                const conduct = CONDUCT_RULES[currentStudent.conductGrade] || 0;
                
                // 常規 5 項體能 (每項 20 分，最高 100)
                const sitUp = calculateSitUpScore(currentStudent.gender, currentStudent.sitUpsRaw, currentStudent.class);
                const pushUp = calculatePushUpScore(currentStudent.gender, currentStudent.pushUpsRaw || 0, currentStudent.class);
                const runLaps = calculateRunScore(currentStudent.gender, currentStudent.runLapsRaw, currentStudent.class);
                const sitReach = calculateSitReachScore(currentStudent.gender, currentStudent.sitReachRaw || 0, currentStudent.class);
                const run1000 = calculateRun1000Score(currentStudent.gender, currentStudent.run1000Raw || 0, currentStudent.class);
                
                // DSE 4 項體能 (每項 5 分，最高 20 分)
                const dseSitUp = calculateDseSitUpScore(currentStudent.gender, currentStudent.dseSitUpsRaw || 0);
                const dsePullUp = calculateDsePullUpScore(currentStudent.gender, currentStudent.dsePullUpsRaw || 0);
                const dseRun1609 = calculateDseRun1609Score(currentStudent.gender, currentStudent.dseRun1609Raw || 0);
                const dseSitReach = calculateDseSitReachScore(currentStudent.gender, currentStudent.dseSitReachRaw || 0);
                const dseTotalFitness = dseSitUp + dsePullUp + dseRun1609 + dseSitReach;

                const skill = calcSkillTotal(currentStudent);
                
                // 區分常規(100分) 或 DSE(20分) 體能
                const fitnessTotal = currentStudent.isDsePe ? dseTotalFitness : (sitUp + pushUp + runLaps + sitReach + run1000);
                
                // 累加並在 100分 處封頂
                const rawTotal = attendance + conduct + fitnessTotal + skill;
                const total100 = Math.min(100, rawTotal);
                const grade = calculateGrade(total100);
                
                return { attendance, conduct, sitUp, pushUp, runLaps, sitReach, run1000, dseSitUp, dsePullUp, dseRun1609, dseSitReach, dseTotalFitness, fitnessTotal, skill, rawTotal, total100, grade };
            }, [currentStudent, thresholds, sitUpRulesByForm, pushUpRulesByForm, runRulesByForm, sitReachRulesByForm, run1000RulesByForm, dseSitUpRules, dsePullUpRules, dseRun1609Rules, dseSitReachRules]);

            const executeExportCSV = () => {
                let targetList = students;
                let exportLabel = "全部學生";

                if (exportScope === "class") {
                    targetList = students.filter(s => s.class === exportTargetClass);
                    exportLabel = `${exportTargetClass}班`;
                } else if (exportScope === "grade") {
                    targetList = students.filter(s => getFormOfStudent(s.class) === exportTargetGrade);
                    exportLabel = `中${getFormChineseLabel(exportTargetGrade)}級`;
                }

                if (targetList.length === 0) {
                    showToast("❌ 該範圍內無任何學生數據，無法導出", "error");
                    return;
                }

                let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
                csvContent += "班別,學號,姓名,性別,課程分類,出席次數(20),學習態度操守,身高(cm),體重(kg),BMI,SitUp次數,SitUp得分,掌上壓次數,掌上壓得分,九分鐘跑圈數,九分鐘跑得分,坐地前伸cm,坐地前伸得分,一千米秒數,一千米得分,DSE-SitUp次數,DSE-SitUp得分,DSE-引體上升次/秒,DSE-引體得分,DSE-1609米跑秒數,DSE-1609得分,DSE-坐地前伸cm,DSE-坐地得分,專項1項目,專項1分數,專項2項目,專項2分數,專項3項目,專項3分數,專項4項目,專項4分數,專項5項目,專項5分數,專項6項目,專項6分數,技能總分,原始總和,最終總分(100),等級\r\n";
                
                targetList.forEach(s => {
                    const conductScore = CONDUCT_RULES[s.conductGrade] || 0;
                    const isDse = s.isDsePe || false;

                    const sitUpScore = isDse ? "" : calculateSitUpScore(s.gender, s.sitUpsRaw, s.class);
                    const pushUpScore = isDse ? "" : calculatePushUpScore(s.gender, s.pushUpsRaw || 0, s.class);
                    const runScore = isDse ? "" : calculateRunScore(s.gender, s.runLapsRaw, s.class);
                    const sitReachScore = isDse ? "" : calculateSitReachScore(s.gender, s.sitReachRaw || 0, s.class);
                    const run1000Score = isDse ? "" : calculateRun1000Score(s.gender, s.run1000Raw || 0, s.class);

                    const dseSitUp = isDse ? calculateDseSitUpScore(s.gender, s.dseSitUpsRaw || 0) : "";
                    const dsePullUp = isDse ? calculateDsePullUpScore(s.gender, s.dsePullUpsRaw || 0) : "";
                    const dseRun1609 = isDse ? calculateDseRun1609Score(s.gender, s.dseRun1609Raw || 0) : "";
                    const dseSitReach = isDse ? calculateDseSitReachScore(s.gender, s.dseSitReachRaw || 0) : "";

                    const skillScore = calcSkillTotal(s);
                    const skillCells = [1, 2, 3, 4, 5, 6].map(n => `${s['skillItem' + n] || ''},${s['skillPts' + n] || 0}`).join(',');
                    
                    const fitnessTotal = isDse ? (Number(dseSitUp) + Number(dsePullUp) + Number(dseRun1609) + Number(dseSitReach)) : (Number(sitUpScore) + Number(pushUpScore) + Number(runScore) + Number(sitReachScore) + Number(run1000Score));
                    const rawTotal = s.attendance + conductScore + fitnessTotal + skillScore;
                    const total100 = Math.min(100, rawTotal);
                    const grade = calculateGrade(total100);

                    csvContent += `${s.class},${s.number},${s.name},${s.gender},${isDse ? 'DSE' : '常規'},${s.attendance},${s.conductGrade}(${conductScore}),${s.height || ""},${s.weight || ""},${calcBMI(s.height, s.weight)},${isDse ? "" : s.sitUpsRaw},${sitUpScore},${isDse ? "" : (s.pushUpsRaw || 0)},${pushUpScore},${isDse ? "" : s.runLapsRaw},${runScore},${isDse ? "" : (s.sitReachRaw || 0)},${sitReachScore},${isDse ? "" : (s.run1000Raw || 0)},${run1000Score},${isDse ? (s.dseSitUpsRaw || 0) : ""},${dseSitUp},${isDse ? (s.dsePullUpsRaw || 0) : ""},${dsePullUp},${isDse ? (s.dseRun1609Raw || 0) : ""},${dseRun1609},${isDse ? (s.dseSitReachRaw || 0) : ""},${dseSitReach},${skillCells},${skillScore},${rawTotal},${total100},${grade}\r\n`;
                });

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `體育科評分數據_${exportLabel}_${new Date().toISOString().split('T')[0]}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setExportModalOpen(false);
                showToast(`📥 成功導出 [ ${exportLabel} ] 的數據為 CSV 檔案`);
            };

            const syncToGoogleSheet = async () => {
                const targetUrl = cloudUrl || DEFAULT_CLOUD_URL;
                if (!targetUrl || !targetUrl.startsWith('https://script.google.com/')) {
                    showToast("❌ 同步失敗：請先在常模設置頁面，填寫正確的 Apps Script 網址！", 'error');
                    return;
                }
                setIsSyncing(true);
                const sentDirty = JSON.parse(JSON.stringify(dirty));
                // 比對「本機值」與「最近一次從雲端讀到的值」：沒有真正改動的欄位 (包括殘留的舊記錄) 一律不上傳
                const sameVal = (a, b) => {
                    const na = (a === undefined || a === null || a === '') ? '' : String(a);
                    const nb = (b === undefined || b === null || b === '') ? '' : String(b);
                    if (na === nb) return true;
                    const fa = parseFloat(na), fb = parseFloat(nb);
                    if (!isNaN(fa) && !isNaN(fb)) return fa === fb;
                    return (na === '' && nb === '0') || (na === '0' && nb === '');
                };
                const dirtyFieldsOf = (student) => {
                    let df = Object.keys(dirty[student.id] || {});
                    const base = baseRef.current[student.id];
                    if (base) df = df.filter(k => !sameVal(student[k], base[k]));
                    return df;
                };
                try {
                    const payload = students.map(student => {
                        const conductScore = CONDUCT_RULES[student.conductGrade] || 0;
                        const isDse = student.isDsePe || false;

                        const sitUpScore = isDse ? "" : calculateSitUpScore(student.gender, student.sitUpsRaw, student.class);
                        const pushUpScore = isDse ? "" : calculatePushUpScore(student.gender, student.pushUpsRaw || 0, student.class);
                        const runScore = isDse ? "" : calculateRunScore(student.gender, student.runLapsRaw, student.class);
                        const sitReachScore = isDse ? "" : calculateSitReachScore(student.gender, student.sitReachRaw || 0, student.class);
                        const run1000Score = isDse ? "" : calculateRun1000Score(student.gender, student.run1000Raw || 0, student.class);

                        const dseSitUp = isDse ? calculateDseSitUpScore(student.gender, student.dseSitUpsRaw || 0) : "";
                        const dsePullUp = isDse ? calculateDsePullUpScore(student.gender, student.dsePullUpsRaw || 0) : "";
                        const dseRun1609 = isDse ? calculateDseRun1609Score(student.gender, student.dseRun1609Raw || 0) : "";
                        const dseSitReach = isDse ? calculateDseSitReachScore(student.gender, student.dseSitReachRaw || 0) : "";

                        const skillScore = calcSkillTotal(student);
                        
                        const realFitnessTotal = isDse ? (Number(dseSitUp) + Number(dsePullUp) + Number(dseRun1609) + Number(dseSitReach)) : (Number(sitUpScore) + Number(pushUpScore) + Number(runScore) + Number(sitReachScore) + Number(run1000Score));
                        const rawTotal = student.attendance + conductScore + realFitnessTotal + skillScore;
                        const totalScore = Math.min(100, rawTotal); 
                        const grade = calculateGrade(totalScore);
                        const skillPayload = {};
                        for (let n = 1; n <= SKILL_SLOTS; n++) {
                            skillPayload['skillItem' + n] = student['skillItem' + n] || '';
                            skillPayload['skillPts' + n] = parseInt(student['skillPts' + n]) || 0;
                        }

                        return {
                            id: student.id,
                            dirtyFields: dirtyFieldsOf(student),
                            class: student.class,
                            number: student.number,
                            name: student.name,
                            gender: student.gender,
                            isDsePe: isDse,
                            attendance: student.attendance,
                            conductGrade: student.conductGrade,
                            conductScore: conductScore,
                            height: student.height || "", weight: student.weight || "",
                            sitUpsRaw: isDse ? "" : student.sitUpsRaw,
                            sitUpScore: sitUpScore,
                            pushUpsRaw: isDse ? "" : (student.pushUpsRaw || 0),
                            pushUpScore: pushUpScore,
                            runLapsRaw: isDse ? "" : student.runLapsRaw,
                            runScore: runScore,
                            sitReachRaw: isDse ? "" : (student.sitReachRaw || 0),
                            sitReachScore: sitReachScore,
                            run1000Raw: isDse ? "" : (student.run1000Raw || 0),
                            run1000Score: run1000Score,
                            // DSE
                            dseSitUpsRaw: isDse ? (student.dseSitUpsRaw || 0) : "",
                            dseSitUpScore: dseSitUp,
                            dsePullUpsRaw: isDse ? (student.dsePullUpsRaw || 0) : "",
                            dsePullUpScore: dsePullUp,
                            dseRun1609Raw: isDse ? (student.dseRun1609Raw || 0) : "",
                            dseRun1609Score: dseRun1609,
                            dseSitReachRaw: isDse ? (student.dseSitReachRaw || 0) : "",
                            dseSitReachScore: dseSitReach,
                            ...skillPayload,
                            skillScore: skillScore,
                            totalScore: totalScore,
                            grade: grade
                        };
                    });

                    // 同步常規與 DSE 5分制常模，徹底清除25分數據
                    const configPayload = {
                        thresholds,
                        sitUpRules: sitUpRulesByForm,
                        pushUpRules: pushUpRulesByForm,
                        runRules: runRulesByForm,
                        sitReachRules: sitReachRulesByForm,
                        run1000Rules: run1000RulesByForm,
                        dseSitUpRules,
                        dsePullUpRules,
                        dseRun1609Rules,
                        dseSitReachRules
                    };

                    const response = await fetch(targetUrl, {
                        method: 'POST',
                        mode: 'cors',
                        redirect: 'follow', 
                        body: JSON.stringify({ 
                            action: 'sync', 
                            data: payload,
                            config: configPayload 
                        })
                    });

                    if (!response.ok) throw new Error(`伺服器錯誤: ${response.status}`);
                    const result = await response.json();
                    if (result.status === 'success') {
                        setHasUnsavedConfig(false);
                        setCloudConnectionStatus("success");
                        setDirty(prev => {
                            const n = { ...prev };
                            Object.keys(sentDirty).forEach(id => {
                                const rem = { ...(n[id] || {}) };
                                Object.keys(sentDirty[id]).forEach(k => { delete rem[k]; });
                                if (Object.keys(rem).length) n[id] = rem; else delete n[id];
                            });
                            return n;
                        });
                        const uploadFieldCount = payload.reduce((a, p) => a + (p.dirtyFields ? p.dirtyFields.length : 0), 0);
                        showToast(`☁️ 同步成功！本次只上傳你修改過的 ${uploadFieldCount} 個欄位 (更新 ${result.count !== undefined ? result.count : '-'} 位學生)，其他資料保持雲端內容。`);
                        // 同步成功後自動讀回雲端，讓畫面立即顯示其他老師已輸入的成績 (本機未同步的輸入不會被覆蓋)
                        await loadDataFromCloud({ silent: true });
                    } else {
                        throw new Error(result.message || 'Apps Script 處理異常');
                    }
                } catch (error) {
                    console.error("同步失敗資訊：", error);
                    setCloudConnectionStatus("failed");
                    showToast(`❌ 同步失敗，請確認常模頁面中的 Apps Script 是否部署為最新版本並設定權限。`, 'error');
                } finally {
                    setIsSyncing(false);
                }
            };

            const mapHeader = (header) => {
                const h = String(header || "").trim();
                if (h.includes("身高") || h.includes("Height")) return "height";
                if (h.includes("體重") || h.includes("Weight")) return "weight";
                if (h.includes("班") || h.includes("Class")) return "class";
                if (h.includes("號") || h.includes("No")) return "number";
                if (h.includes("名") || h.includes("Name")) return "name";
                if (h.includes("性") || h.includes("Gender")) return "gender";
                if (h.includes("DSE") || h.includes("選修")) return "isDsePe";
                if (h.includes("出") || h.includes("Attendance")) return "attendance";
                if (h.includes("態") || h.includes("操") || h.includes("Conduct") || h.includes("學習")) return "conductGrade";
                if (h.includes("仰臥") || h.includes("SitUp") || h.includes("Sit-up")) return "sitUpsRaw";
                if (h.includes("掌上壓") || h.includes("Push")) return "pushUpsRaw";
                if (h.includes("九分鐘") || h.includes("耐力") || h.includes("Run")) return "runLapsRaw";
                if (h.includes("前伸") || h.includes("SitReach") || h.includes("坐地")) return "sitReachRaw";
                if (h.includes("一千") || h.includes("1000m") || h.includes("千米")) return "run1000Raw";
                
                // DSE 
                if (h.includes("DSE仰臥") || h.includes("DseSitUp")) return "dseSitUpsRaw";
                if (h.includes("DSE引體") || h.includes("DsePull")) return "dsePullUpsRaw";
                if (h.includes("DSE1609") || h.includes("Dse1609")) return "dseRun1609Raw";
                if (h.includes("DSE坐地") || h.includes("DseSitReach")) return "dseSitReachRaw";
                if (h.includes("籃") || h.includes("Basket")) return "basketball";
                if (h.includes("舞") || h.includes("Dance")) return "dance";
                if (h.includes("其他") || h.includes("Extra")) return "extraSkill";
                return null;
            };

            const handleExcelImport = (evt) => {
                const file = evt.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = e.target.result;
                        const workbook = XLSX.read(data, { type: 'binary' });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                        if (json.length < 2) {
                            setImportError("Excel 檔案內容不足。");
                            setPreviewStudents([]);
                            setImportModalOpen(true);
                            return;
                        }

                        const headers = json[0].map(h => String(h || ""));
                        const rows = json.slice(1);

                        const colIndices = {};
                        headers.forEach((header, index) => {
                            const field = mapHeader(header);
                            if (field) colIndices[field] = index;
                        });

                        importColsRef.current = { ...colIndices };
                        if (colIndices.name === undefined) {
                            setImportError("找不到『姓名』欄位，請確認首行標題。");
                            setPreviewStudents([]);
                            setImportModalOpen(true);
                            return;
                        }

                        const parsedStudents = [];
                        rows.forEach((row, idx) => {
                            if (!row || row.length === 0 || !row[colIndices.name]) return;
                            const studentName = String(row[colIndices.name] || "").trim();
                            if (!studentName) return;

                            const genderRaw = colIndices.gender !== undefined ? String(row[colIndices.gender] || "").trim().toUpperCase() : "M";
                            const gender = (genderRaw.includes("F") || genderRaw.includes("女")) ? "F" : "M";

                            const isDseRaw = colIndices.isDsePe !== undefined ? String(row[colIndices.isDsePe] || "").trim().toUpperCase() : "";
                            const isDsePe = isDseRaw.includes("DSE") || isDseRaw.includes("是") || isDseRaw.includes("TRUE") || isDseRaw.includes("1");

                            const classVal = colIndices.class !== undefined ? String(row[colIndices.class] || "").trim().toUpperCase() : "2A";
                            const numberVal = colIndices.number !== undefined ? String(row[colIndices.number] || "").trim() : String(idx + 1);
                            const attendanceVal = colIndices.attendance !== undefined ? parseInt(row[colIndices.attendance]) : 20;

                            let conductRaw = colIndices.conductGrade !== undefined ? String(row[colIndices.conductGrade] || "").trim() : "B";
                            const conductMatch = conductRaw.match(/([A-DFa-df][+-]?)/);
                            const conductGrade = conductMatch ? conductMatch[1].toUpperCase() : "B";

                            const sitUpsRaw = colIndices.sitUpsRaw !== undefined ? parseInt(row[colIndices.sitUpsRaw]) || 0 : 0;
                            const pushUpsRaw = colIndices.pushUpsRaw !== undefined ? parseInt(row[colIndices.pushUpsRaw]) || 0 : 0;
                            const runLapsRaw = colIndices.runLapsRaw !== undefined ? parseInt(row[colIndices.runLapsRaw]) || 0 : 0;
                            const sitReachRaw = colIndices.sitReachRaw !== undefined ? parseInt(row[colIndices.sitReachRaw]) || 0 : 0;
                            const run1000Raw = colIndices.run1000Raw !== undefined ? parseInt(row[colIndices.run1000Raw]) || 0 : 0;
                            
                            // DSE
                            const dseSitUpsRaw = colIndices.dseSitUpsRaw !== undefined ? parseInt(row[colIndices.dseSitUpsRaw]) || 0 : 0;
                            const dsePullUpsRaw = colIndices.dsePullUpsRaw !== undefined ? parseInt(row[colIndices.dsePullUpsRaw]) || 0 : 0;
                            const dseRun1609Raw = colIndices.dseRun1609Raw !== undefined ? parseInt(row[colIndices.dseRun1609Raw]) || 0 : 0;
                            const dseSitReachRaw = colIndices.dseSitReachRaw !== undefined ? parseInt(row[colIndices.dseSitReachRaw]) || 0 : 0;

                            const basketball = colIndices.basketball !== undefined ? parseInt(row[colIndices.basketball]) || 0 : 0;
                            const dance = colIndices.dance !== undefined ? parseInt(row[colIndices.dance]) || 0 : 0;
                            const extraSkill = colIndices.extraSkill !== undefined ? parseInt(row[colIndices.extraSkill]) || 0 : 0;
                            const height = colIndices.height !== undefined ? parseFloat(row[colIndices.height]) || 0 : 0;
                            const weight = colIndices.weight !== undefined ? parseFloat(row[colIndices.weight]) || 0 : 0;

                            parsedStudents.push(normalizeStudent({
                                id: Date.now() + idx, class: classVal, number: numberVal, name: studentName, gender: gender, isDsePe: isDsePe,
                                attendance: Math.min(20, Math.max(0, isNaN(attendanceVal) ? 20 : attendanceVal)),
                                conductGrade: CONDUCT_RULES[conductGrade] !== undefined ? conductGrade : "B",
                                sitUpsRaw: Math.max(0, isNaN(sitUpsRaw) ? 0 : sitUpsRaw),
                                pushUpsRaw: Math.max(0, isNaN(pushUpsRaw) ? 0 : pushUpsRaw),
                                runLapsRaw: Math.max(0, isNaN(runLapsRaw) ? 0 : runLapsRaw),
                                sitReachRaw: Math.max(0, isNaN(sitReachRaw) ? 0 : sitReachRaw),
                                run1000Raw: Math.max(0, isNaN(run1000Raw) ? 0 : run1000Raw), 
                                // DSE
                                dseSitUpsRaw: Math.max(0, isNaN(dseSitUpsRaw) ? 0 : dseSitUpsRaw),
                                dsePullUpsRaw: Math.max(0, isNaN(dsePullUpsRaw) ? 0 : dsePullUpsRaw),
                                dseRun1609Raw: Math.max(0, isNaN(dseRun1609Raw) ? 0 : dseRun1609Raw), 
                                dseSitReachRaw: Math.max(0, isNaN(dseSitReachRaw) ? 0 : dseSitReachRaw),

                                basketball: Math.min(9, Math.max(0, isNaN(basketball) ? 0 : basketball)),
                                dance: Math.min(11, Math.max(0, isNaN(dance) ? 0 : dance)),
                                extraSkill: Math.min(20, Math.max(0, isNaN(extraSkill) ? 0 : extraSkill)),
                                height: height,
                                weight: weight
                            }));
                        });

                        if (parsedStudents.length === 0) {
                            setImportError("沒有成功解析到任何學生資料。");
                            setPreviewStudents([]);
                        } else {
                            setImportError("");
                            setPreviewStudents(parsedStudents);
                        }
                        setImportModalOpen(true);
                    } catch (err) {
                        setImportError("讀取檔案出錯，請檢查格式是否正確。");
                        setPreviewStudents([]);
                        setImportModalOpen(true);
                    }
                };
                reader.readAsBinaryString(file);
                evt.target.value = null; 
            };

            // 匯入時只標記「Excel 有這一欄、而且有填數值」的欄位為已修改，空白或 0 不會覆蓋雲端上別人輸入的成績
            const getImportDirty = (s) => {
                const cols = importColsRef.current || {};
                const d = { name: true };
                ['class', 'number', 'gender', 'isDsePe'].forEach(k => { if (cols[k] !== undefined) d[k] = true; });
                ['attendance', 'sitUpsRaw', 'pushUpsRaw', 'runLapsRaw', 'sitReachRaw', 'run1000Raw', 'dseSitUpsRaw', 'dsePullUpsRaw', 'dseRun1609Raw', 'dseSitReachRaw', 'height', 'weight'].forEach(k => {
                    if (cols[k] !== undefined && (parseFloat(s[k]) || 0) > 0) d[k] = true;
                });
                if (cols.conductGrade !== undefined && s.conductGrade) d.conductGrade = true;
                [['basketball', 1], ['dance', 2], ['extraSkill', 3]].forEach(([k, n]) => {
                    if (cols[k] !== undefined && (parseInt(s['skillPts' + n]) || 0) > 0) { d['skillPts' + n] = true; d['skillItem' + n] = true; }
                });
                return d;
            };

            const confirmImport = () => {
                if (previewStudents.length > 0) {
                    setStudents(previewStudents);
                    setDirty(prev => { const n = { ...prev }; previewStudents.forEach(s => { n[s.id] = getImportDirty(s); }); return n; });
                    setCurrentMobileIndex(0);
                    setCurrentPage(1);
                    showToast(`✅ 成功導入 ${previewStudents.length} 筆學生資料！`);
                }
                setImportModalOpen(false);
                setPreviewStudents([]);
            };

            const handleAddStudent = (evt) => {
                evt.preventDefault();
                if (!newStudent.name || !newStudent.number) {
                    alert("請填寫姓名與學號！");
                    return;
                }
                const created = {
                    ...newStudent,
                    id: Date.now(),
                    class: String(newStudent.class).toUpperCase().trim()
                };
                const updatedList = [...students, created];
                setDirty(prev => ({ ...prev, [created.id]: { class: true, number: true, name: true, gender: true, isDsePe: true, attendance: true, conductGrade: true } }));
                setStudents(updatedList);
                setAddModalOpen(false);
                setNewStudent({ class: "2A", number: "", name: "", gender: "M", isDsePe: false, attendance: 0, conductGrade: "B", sitUpsRaw: 0, pushUpsRaw: 0, runLapsRaw: 0, sitReachRaw: 0, run1000Raw: 0, dseSitUpsRaw: 0, dsePullUpsRaw: 0, dseRun1609Raw: 0, dseSitReachRaw: 0, ...EMPTY_SKILLS });
                showToast(`➕ 已新增學生：${created.name}`);
            };

            const handleDeleteStudent = (id, name) => {
                setConfirmModal({
                    message: `確定要刪除學生「${name}」嗎？此操作無法還原。`,
                    action: () => {
                        const updated = students.filter(s => s.id !== id);
                        setStudents(updated);
                        showToast(`🗑️ 已刪除學生：${name}`, 'error');
                        setConfirmModal(null);
                    }
                });
            };

            const handleResetDefault = () => {
                setConfirmModal({
                    message: "確定要重設為系統預設的常規及 DSE 成績與常模基準線嗎？目前的修改將會被覆蓋。",
                    action: () => {
                        setStudents(DEFAULT_STUDENTS);
                        setSitUpRulesByForm(DEFAULT_SIT_UP_RULES_BY_FORM);
                        setPushUpRulesByForm(DEFAULT_PUSH_UP_RULES_BY_FORM);
                        setRunRulesByForm(DEFAULT_RUN_RULES_BY_FORM);
                        setSitReachRulesByForm(DEFAULT_SIT_REACH_RULES_BY_FORM);
                        setRun1000RulesByForm(DEFAULT_RUN_1000_RULES_BY_FORM);
                        setDseSitUpRules(DEFAULT_DSE_SITUP_RULES);
                        setDsePullUpRules(DEFAULT_DSE_PULLUP_RULES);
                        setDseRun1609Rules(DEFAULT_DSE_RUN1609_RULES);
                        setDseSitReachRules(DEFAULT_DSE_SIT_REACH_RULES);
                        setThresholds({ A: 89.5, B: 79.5, C: 69.5, D: 59.5, E: 49.5 });
                        setTempThresholds({ A: 89.5, B: 79.5, C: 69.5, D: 59.5, E: 49.5 });
